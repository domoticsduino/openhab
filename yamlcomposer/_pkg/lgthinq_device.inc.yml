variables:
  device_name: ${package_id}
  label: "${device_name}"
  bridge: ${common.lgthinq.bridge.type}:${common.lgthinq.bridge.id} 
  piano: null
  stanza: null
  location_group: "${'gl' ~ stanza if stanza != '' else 'glCasa'}"
  pfx: "${piano}${stanza}"
  dev_clean: "${device_name | replace('-', '_') | replace('.', '_')}"
  ip_address: null
  equipments: []
  outputs: []
  sensors: []
  thing_type: null
  thing_id: ${dev_clean}
  $config: null

packages:
  <<: !if
    if: ip_address != null
    then:
      network_pkg: !include
        file: $_pkg/network_device.inc.yml
        vars:
          package_id: "${package_id}"
          label: "${label}"
          ip: "${ip_address}"
          piano: "${piano}"
          stanza: "${stanza}"

things:
  ${thing_type}:${thing_id}:
    bridge: ${bridge}
    label: "${label}"
    location: "${stanza}"
    config: ${config}

items:
  
  !for "equip in equipments":
    <<: !include $_pkg/_common/item_equipment.inc.yml

  !for "idx, output in outputs | enumerate":
    <<: !include
      file: $_pkg/_common/item_output.inc.yml
      vars:
        output: ${output}
        channels: ${output.channels}

  !for "idx, sensor in sensors | enumerate":
    <<: !include 
      file: $_pkg/_common/item_sensor.inc.yml
      vars:
        sensor: ${sensor}
        channels: ${sensor.channels}